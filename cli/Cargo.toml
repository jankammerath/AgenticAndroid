[package]
name = "agentic-android-cli"
version = "0.4.2"
edition = "2021"

[[bin]]
name = "agentic-android"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
strip = true
