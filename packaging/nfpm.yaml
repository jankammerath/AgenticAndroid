name: agentic-android
arch: amd64
platform: linux
version: "${VERSION}"
release: "1"
section: utils
priority: optional
maintainer: "Jan Kammerath <https://github.com/jankammerath/AgenticAndroid>"
description: |
  Agentic Android headless emulator supervisor and APK.
  Runs an Android emulator as a systemd service with the Agentic Android
  Rust core webserver and Accessibility Service enabled automatically.
homepage: "https://github.com/jankammerath/AgenticAndroid"
license: MIT

contents:
  - src: ./cli/target/release/agentic-android
    dst: /usr/bin/agentic-android
    file_info:
      mode: 0755

  - src: ./dist/AgenticAndroid.apk
    dst: /usr/share/agentic-android/AgenticAndroid.apk
    file_info:
      mode: 0644

  - src: ./packaging/config.toml
    dst: /etc/agentic-android/config.toml
    type: config|noreplace
    file_info:
      mode: 0644

  - src: ./packaging/agentic-android.service
    dst: /lib/systemd/system/agentic-android.service
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/postinstall.sh
  preremove: ./packaging/preremove.sh
