name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build-release:
    name: Build Universal Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Set up Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: Build Rust NDK core for Android ABIs
        run: |
          TOOLCHAIN_BIN="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export AR_aarch64_linux_android="${TOOLCHAIN_BIN}/llvm-ar"
          export CC_aarch64_linux_android="${TOOLCHAIN_BIN}/aarch64-linux-android29-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN_BIN}/aarch64-linux-android29-clang"

          export AR_armv7_linux_androideabi="${TOOLCHAIN_BIN}/llvm-ar"
          export CC_armv7_linux_androideabi="${TOOLCHAIN_BIN}/armv7a-linux-androideabi29-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="${TOOLCHAIN_BIN}/armv7a-linux-androideabi29-clang"

          export AR_x86_64_linux_android="${TOOLCHAIN_BIN}/llvm-ar"
          export CC_x86_64_linux_android="${TOOLCHAIN_BIN}/x86_64-linux-android29-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${TOOLCHAIN_BIN}/x86_64-linux-android29-clang"

          cd rust-core
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target x86_64-linux-android

          mkdir -p ../app/src/main/jniLibs/arm64-v8a \
                   ../app/src/main/jniLibs/armeabi-v7a \
                   ../app/src/main/jniLibs/x86_64

          cp target/aarch64-linux-android/release/libagentic_android.so ../app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libagentic_android.so ../app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libagentic_android.so ../app/src/main/jniLibs/x86_64/

      - name: Prepare APK signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "store_password=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${ANDROID_KEY_ALIAS}" >> "$GITHUB_OUTPUT"
            echo "key_password=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured; generating ad-hoc release keystore so APK is sideloadable."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass agenticandroid \
              -keypass agenticandroid \
              -alias agenticandroid \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Agentic Android, O=AgenticAndroid, C=US"
            echo "store_password=agenticandroid" >> "$GITHUB_OUTPUT"
            echo "key_alias=agenticandroid" >> "$GITHUB_OUTPUT"
            echo "key_password=agenticandroid" >> "$GITHUB_OUTPUT"
          fi
          echo "store_file=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ steps.signing.outputs.store_password }}
          SIGNING_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          SIGNING_KEY_PASSWORD: ${{ steps.signing.outputs.key_password }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare release APK asset
        id: asset
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AgenticAndroid.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/AgenticAndroid-${TAG_NAME}.apk"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgenticAndroid-${{ steps.asset.outputs.tag_name }}
          path: dist/AgenticAndroid.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.asset.outputs.tag_name }}
          name: Agentic Android ${{ steps.asset.outputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/AgenticAndroid.apk
            dist/AgenticAndroid-${{ steps.asset.outputs.tag_name }}.apk
